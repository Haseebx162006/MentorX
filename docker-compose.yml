services:
  backend:
    build:
      context: ./mentorx/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./mentorx/backend/.env
    environment:
      - PORT=8000

  frontend:
    build:
      context: ./mentorx/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
