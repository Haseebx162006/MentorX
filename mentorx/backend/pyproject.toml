[project]
name = "backend"
version = "0.1.0"
description = "MentorX Backend API with SQLAlchemy ORM, PostgreSQL (Neon), and LangGraph RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg-pool>=3.2.0",
    "psycopg>=3.2.0",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "psycopg2-binary>=2.9.9",
    "qdrant-client>=1.19.0",
    "sqlalchemy>=2.0.35",
    "uvicorn>=0.52.4",
]
